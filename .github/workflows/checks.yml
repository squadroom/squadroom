# The four checks, on every pull request and on pushes to main. No secrets
# and no deploy step. The tests are pure, so Linux runs them; the launcher
# and sandbox tests need macOS (zsh, sandbox-exec) and skip themselves on
# Linux, so the macos job runs them, and none may skip there.
# Actions are pinned to a commit (the release in the comment); Dependabot
# updates both.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee test-output.log
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
      - run: npm run build

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The shell scripts parse (zsh -n)
        run: for script in scripts/console/console-agent scripts/console/*.sh scripts/*.sh; do zsh -n "$script"; done
      - name: Launcher, sandbox and setup tests (none may skip)
        shell: bash
        run: |
          npm run test:macos 2>&1 | tee test-macos.log
          grep -qx 'ℹ skipped 0' test-macos.log || { echo "a macOS test skipped"; exit 1; }
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-macos-output
          path: test-macos.log
          if-no-files-found: ignore
