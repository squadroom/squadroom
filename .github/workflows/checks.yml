# The four checks, on every pull request and on pushes to main. No secrets
# and no deploy step. The tests are pure, so Linux runs them (macOS-only
# sandbox tests skip themselves there).
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee test-output.log
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
      - run: npm run build
