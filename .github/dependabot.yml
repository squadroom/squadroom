# Weekly update pull requests for npm packages and the workflow's actions.
# Each one goes through the same checks and maintainer review as any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Packages released together move together, in one pull request.
    groups:
      react:
        patterns: ["react", "react-dom"]
      next:
        patterns: ["next", "@next/env", "eslint-config-next"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
