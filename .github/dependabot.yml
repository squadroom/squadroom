# Weekly update pull requests for npm packages and the workflow's actions.
# Each one goes through the same checks as any other pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Packages released together move together, in one pull request.
    groups:
      react:
        patterns: ["react", "react-dom"]
      next:
        patterns: ["next", "@next/env", "eslint-config-next"]
  # Each agent client's pin, one folder per client. The pin in
  # src/lib/console/clients.ts has to move with each of these.
  - package-ecosystem: npm
    directory: /scripts/console/clients/claude
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /scripts/console/clients/codex
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /scripts/console/clients/gemini
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /scripts/console/clients/grok
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /scripts/console/clients/kimi
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /scripts/console/clients/opencode
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
